<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-skin="abyss">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsPub AI — 受控运维工作台 · 全新视觉 v3</title>
<!--
  全新视觉优化版原型 v3（2026-11-17）
  参考基线：docs/remote-ops-ai-prototype.html（内容），视觉语言彻底重做。

  相对 v2 / 老基线的改动：
  1. 全新配色：主色由「靛蓝 #6366f1 + 翠绿」改为「青蓝 #22d3ee + 珊瑚橙 #fb7185」，
     布局语言改为仪表盘风格（数据可视化 + 彩色标识条 + 更紧凑字阶），与老基线一眼区分；
  2. 内容补全：把老原型被砍掉的详细画面全部补回——
     工作台 13 子视图、服务器导入/收藏/最近/批量、数据库多引擎+NL2SQL、
     批量执行、终端田字分屏、AI 桥接、MCP、技能库、巡检 4 子视图、
     敏感库、凭据、告警、审批闭环、审计链、设置 4 大类；
  3. 新增设计保留：总览首页、部署流水线 + 版本树 + 回滚、审批闭环、环境模型；
  4. 桌面窗口：1440×900 默认 + 三联键 + ResizeObserver 自适应；
  5. 全文件无 alert() / 无 CDN 依赖，Tauri asset 协议可离线打开。

  纯前端单文件。路由 key 与 src/navigation/modules.ts 17 项对齐。
-->
<style>
/* 1. 全新设计令牌 —— 青蓝 + 珊瑚橙 */
:root{
  --brand:#22d3ee; --brand-2:#67e8f9; --brand-6:#0891b2;
  --accent:#fb7185; --accent-2:#fb923c; --violet:#c084fc;
  --ok:#34d399; --warn:#fbbf24; --danger:#fb7185; --info:#38bdf8;
  --ok-soft:rgba(52,211,153,.13); --warn-soft:rgba(251,191,36,.13);
  --danger-soft:rgba(251,113,133,.13); --info-soft:rgba(56,189,248,.13);
  --brand-soft:rgba(34,211,238,.13);
  --r:10px; --r-sm:7px;
  --font:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#080d14; --bg-2:#0c1420; --panel:#101b2b; --panel-2:#16243a; --panel-3:#1d3049;
  --line:rgba(125,160,200,.16); --line2:rgba(125,160,200,.3);
  --text:#dce8f5; --text2:#8ba3bd; --text3:#5d7692; --card:#101b2b;
  --shadow:0 14px 40px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#eef3f8; --bg-2:#e3ebf3; --panel:#ffffff; --panel-2:#f4f8fc; --panel-3:#e6eef6;
  --line:rgba(20,50,80,.12); --line2:rgba(20,50,80,.22);
  --text:#14263b; --text2:#4c6580; --text3:#8197ae; --card:#ffffff;
  --shadow:0 12px 34px rgba(20,50,80,.12);
}
html[data-skin="abyss"] { --skin-bg:#080d14; --brand:#22d3ee; --brand-2:#67e8f9; }
html[data-skin="ember"] { --skin-bg:#160d0c; --brand:#fb923c; --brand-2:#fdba74; }
html[data-skin="mint"]  { --skin-bg:#08130f; --brand:#34d399; --brand-2:#6ee7b7; }
html[data-skin="violet"]{ --skin-bg:#0d0a16; --brand:#a78bfa; --brand-2:#c4b5fd; }
html[data-skin="steel"] { --skin-bg:#0b0f14; --brand:#94a3b8; --brand-2:#cbd5e1; }
html[data-skin="paper"] { --skin-bg:#f4f1ea; --brand:#0e7490; --brand-2:#0891b2; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 8%,#152335 0%,#05080d 100%)}
html[data-theme="light"] body{background:radial-gradient(circle at 50% 8%,#dbe6f0 0%,#a7b8c9 100%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:13px;height:13px}.ico.lg{width:19px;height:19px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* 桌面窗口外壳：1440×900 */
#win{width:1440px;height:900px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);
  aspect-ratio:1440/900;display:flex;flex-direction:column;position:relative;overflow:hidden;
  border-radius:12px;background:var(--bg);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 28px 80px -16px rgba(0,0,0,.72),0 0 46px rgba(34,211,238,.08);
  transition:width .24s cubic-bezier(.16,1,.3,1),height .24s cubic-bezier(.16,1,.3,1),border-radius .2s,transform .24s,opacity .24s}
#win.maximized{width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important;border:0!important;box-shadow:none!important}
#win.minimizing{transform:scale(.82) translateY(36px);opacity:.35}
.app{height:100%;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#sizeHint{position:fixed;right:16px;bottom:14px;z-index:60;font-family:var(--mono);font-size:10px;
  padding:5px 10px;border-radius:7px;color:#cbd5e1;background:rgba(8,12,20,.85);
  border:1px solid rgba(148,163,184,.2);pointer-events:none;backdrop-filter:blur(6px)}
#sizeHint b{color:var(--brand-2);font-weight:600}

/* 顶栏 */
.top{height:50px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg,var(--panel),var(--bg-2));border-bottom:1px solid var(--line);
  z-index:30;-webkit-app-region:drag}
.top button,.top input,.top select{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:.2px;white-space:nowrap}
.brand .mark{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;color:#05202b;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 0 14px var(--brand-soft)}
.brand em{font-style:normal;font-size:9px;color:var(--text3);font-family:var(--mono);font-weight:500}
.env{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--bg);border:1px solid var(--line2)}
.env button{padding:3px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text3)}
.env button.on[data-env="prod"]{background:var(--danger-soft);color:var(--accent)}
.env button.on[data-env="staging"]{background:var(--warn-soft);color:var(--warn)}
.env button.on[data-env="dev"]{background:var(--ok-soft);color:var(--ok)}
.crumb{color:var(--text3);font-size:11.5px;min-width:0;display:flex;gap:6px;align-items:center}
.crumb strong{color:var(--text);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);color:var(--text2);font-size:11px}
.tb:hover{color:var(--text);border-color:var(--line2)}
.tbi{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--text2);border:1px solid var(--line);background:var(--bg);position:relative}
.tbi:hover{color:var(--text)}
.lock{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;font-size:10.5px;font-family:var(--mono);font-weight:700;border:1px solid}
.lock.on{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,211,153,.3)}
.lock.off{color:var(--accent);background:var(--danger-soft);border-color:rgba(251,113,133,.3)}
.winctl{display:flex;gap:1px;margin-left:2px}
.winctl button{width:28px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--text3)}
.winctl button:hover{background:var(--panel-3);color:var(--text)}
.winctl button.x:hover{background:#e11d48;color:#fff}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dot.warn{background:var(--warn)}.dot.danger{background:var(--danger);animation:pl 1.7s infinite}
@keyframes pl{50%{opacity:.3}}

/* 主体：导航轨 + 内容 */
.body{flex:1;display:flex;min-height:0}
.rail{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;background:var(--bg-2);
  border-right:1px solid var(--line);padding:7px 0;overflow-y:auto;overscroll-behavior:contain}
.rail-scroll{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 6px}
.rail-gap{width:26px;border-top:1px solid var(--line);margin:5px 0}
.rail-cap{font-size:8px;color:var(--text3);font-family:var(--mono);letter-spacing:.5px;margin:6px 0 2px;text-transform:uppercase}
.nav{width:58px;min-height:44px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text3);position:relative;transition:.15s;padding:3px 1px}
.nav:hover{background:var(--panel-2);color:var(--text)}
.nav .t{font-size:9.5px;line-height:1.05;white-space:nowrap}
.nav .b{position:absolute;top:3px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.nav .b.danger{background:var(--danger)}.nav .b.warn{background:var(--warn)}
/* 选中态：青蓝左侧光条，不用翠绿 */
.nav.on{color:var(--brand-2);background:var(--brand-soft);box-shadow:inset 2px 0 0 var(--brand)}
.nav.on .ico{color:var(--brand)}
.rail-foot{width:100%;margin-top:auto;border-top:1px solid var(--line);padding-top:5px;display:flex;flex-direction:column;align-items:center;gap:2px}
main{flex:1;min-width:0;overflow-y:auto;background:radial-gradient(circle at 90% 0%,var(--brand-soft),transparent 32%),var(--bg)}
.page{padding:16px 20px 26px;max-width:1560px;margin:0 auto}

/* 通用组件 */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.pt{display:flex;align-items:center;gap:9px}.pt h1{font-size:17px;margin:0;font-weight:750;letter-spacing:.2px}
.pt .ico{color:var(--brand)}.pd{color:var(--text3);font-size:11px;margin-top:3px}
.acts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;
  font-size:11.5px;font-weight:650;border:1px solid var(--line2);background:var(--panel-2);color:var(--text2);transition:.15s;white-space:nowrap}
.btn:hover{color:var(--text);background:var(--panel-3)}
.btn.pri{background:linear-gradient(135deg,var(--brand-6),var(--brand));border-color:transparent;color:#052029;box-shadow:0 3px 14px var(--brand-soft)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.acc{background:var(--danger-soft);border-color:rgba(251,113,133,.3);color:var(--accent)}
.btn.ok{background:var(--ok-soft);border-color:rgba(52,211,153,.3);color:var(--ok)}
.btn.gh{background:transparent;border-color:transparent;color:var(--text3)}
.btn.gh:hover{background:var(--panel-2);color:var(--text)}
.btn.sm{height:25px;padding:0 8px;font-size:10.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 94%,var(--bg)));
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card.bar:before,.card.acc-bar:before,.card.warn-bar:before,.card.ok-bar:before{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.card.bar:before{background:linear-gradient(90deg,var(--brand),transparent 70%)}
.card.acc-bar:before{background:linear-gradient(90deg,var(--accent),transparent 70%)}
.card.warn-bar:before{background:linear-gradient(90deg,var(--warn),transparent 70%)}
.card.ok-bar:before{background:linear-gradient(90deg,var(--ok),transparent 70%)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.ch h3 .ico{color:var(--brand)}
.cb{padding:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mb{margin-bottom:12px}.muted{color:var(--text3)}.small{font-size:10.5px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:650;border:1px solid var(--line2);color:var(--text2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);border-color:rgba(52,211,153,.3);color:var(--ok)}
.tag.warn{background:var(--warn-soft);border-color:rgba(251,191,36,.3);color:var(--warn)}
.tag.danger{background:var(--danger-soft);border-color:rgba(251,113,133,.3);color:var(--accent)}
.tag.info{background:var(--info-soft);border-color:rgba(56,189,248,.3);color:var(--info)}
.tag.brand{background:var(--brand-soft);border-color:rgba(34,211,238,.3);color:var(--brand-2)}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);min-width:190px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:11.5px}
.search input::placeholder{color:var(--text3)}
.kbd{font-family:var(--mono);font-size:9px;padding:1px 4px;border-radius:4px;border:1px solid var(--line2);color:var(--text3)}
.sel{height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);font-size:11px;color:var(--text2)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;padding:8px 10px;color:var(--text3);font-weight:650;font-size:9.5px;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--brand-soft)}
.link{color:var(--brand-2);font-weight:650;cursor:pointer}.link:hover{text-decoration:underline}
.rowact{display:flex;gap:5px}
.notice{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:8px;font-size:11px;border:1px solid}
.notice.warn{background:var(--warn-soft);border-color:rgba(251,191,36,.3);color:var(--warn)}
.notice.info{background:var(--info-soft);border-color:rgba(56,189,248,.3);color:var(--info)}
.notice.danger{background:var(--danger-soft);border-color:rgba(251,113,133,.3);color:var(--accent)}
.notice.ok{background:var(--ok-soft);border-color:rgba(52,211,153,.3);color:var(--ok)}

/* 数据可视化 */
.kpi{padding:12px 14px}
.kpi .kt{display:flex;align-items:center;justify-content:space-between;color:var(--text2);font-size:11px}
.kpi .kv{font-size:25px;font-weight:780;letter-spacing:-.6px;font-family:var(--mono);margin-top:5px;line-height:1.1}
.kpi .ks{font-size:10px;color:var(--text3);margin-top:3px}
.donut{width:62px;height:62px}
.pipe{display:flex;gap:0;overflow-x:auto;padding:4px 0 8px}
.stage{flex:1;min-width:104px;text-align:center;position:relative;padding:0 4px}
.stage:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:var(--panel-3);z-index:0}
.stage.done:not(:last-child):after{background:var(--ok)}
.stage .node{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  background:var(--panel-2);border:2px solid var(--panel-3);color:var(--text3);position:relative;z-index:1}
.stage.done .node{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.stage.active .node{background:var(--brand);border-color:var(--brand-2);color:#052029;box-shadow:0 0 0 5px var(--brand-soft)}
.stage .sn{font-size:11px;font-weight:650;color:var(--text2)}
.stage.active .sn{color:var(--text)}
.stage .st{font-size:9.5px;color:var(--text3);font-family:var(--mono)}
.console{background:#050a12;border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-family:var(--mono);
  font-size:10.5px;line-height:1.7;color:#9fb4cc;height:190px;overflow-y:auto}
.console .ln{white-space:pre-wrap;word-break:break-all}
.console .t{color:#54708f}.console .ok{color:var(--ok)}.console .warn{color:var(--warn)}.console .info{color:var(--info)}
.code{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--text2);white-space:pre-wrap;word-break:break-all}
.code .c{color:var(--text3)}.code .k{color:var(--violet)}
.vrow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;border:1px solid transparent}
.vrow:hover{background:var(--panel-2);border-color:var(--line)}
.vrow.current{background:var(--ok-soft);border-color:rgba(52,211,153,.3)}
.vline{width:1px;height:10px;background:var(--line2);margin-left:15px}

.ticket{display:flex;gap:10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);margin-bottom:7px;cursor:pointer;transition:.15s}
.ticket:hover{border-color:var(--line2);transform:translateX(2px)}
.ticket.on{border-color:var(--brand);background:var(--brand-soft)}
.ticket .risk{width:3px;border-radius:3px;flex:none}
.risk.high{background:var(--danger)}.risk.mid{background:var(--warn)}.risk.low{background:var(--ok)}
.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--text3)}
.chain .blk{padding:3px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--bg)}
.chain .blk.head{color:var(--brand-2);border-color:rgba(34,211,238,.35)}

/* 工作台二级侧栏 */
.wbside{width:150px;flex:none;border-right:1px solid var(--line);background:var(--bg-2);padding:8px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.wbcap{font-size:8.5px;color:var(--text3);font-weight:700;letter-spacing:.5px;padding:0 7px;text-transform:uppercase}
.wbn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:7px;font-size:11px;color:var(--text2);text-align:left}
.wbn:hover{background:var(--panel-2);color:var(--text)}
.wbn.on{background:var(--brand-soft);color:var(--brand-2);font-weight:650;box-shadow:inset 2px 0 0 var(--brand)}
.wbmain{flex:1;min-width:0;overflow-y:auto;padding:13px 15px}
.hostbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}

.sw{position:relative;width:36px;height:20px;border-radius:20px;background:var(--panel-3);transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--brand-6)}.sw.on:after{transform:translateX(16px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.seg{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.seg button{padding:3px 9px;border-radius:5px;font-size:10px;color:var(--text3)}
.seg button.on{background:var(--brand-soft);color:var(--brand-2);font-weight:650}

.ov{position:fixed;inset:0;background:rgba(3,7,13,.66);backdrop-filter:blur(4px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.ov.show{display:flex}
.palette{width:min(580px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.palette-in{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.palette-in input{flex:1;border:0;outline:0;background:transparent;font-size:13px}
.plist{max-height:370px;overflow-y:auto;padding:6px}
.pi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--text2)}
.pi:hover,.pi.sel{background:var(--panel-2);color:var(--text)}
.pi .pg{margin-left:auto;font-size:9.5px;color:var(--text3);font-family:var(--mono)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:11.5px;max-width:400px;animation:tin .2s}
.toast.ok{border-color:rgba(52,211,153,.4)}.toast.warn{border-color:rgba(251,191,36,.4)}.toast.danger{border-color:rgba(251,113,133,.4)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal{width:min(500px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.mh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mb{padding:16px}.mf{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:650}
.field input,.field select{width:100%;height:32px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);outline:0}

/* 容器断点（基于窗口宽度） */
#win[data-size="md"] .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
#win[data-size="md"] .g21,#win[data-size="md"] .g12{grid-template-columns:1fr}
#win[data-size="md"] .page{padding:13px 15px}
#win[data-size="md"] .crumb{display:none}
#win[data-size="sm"] .g4,#win[data-size="sm"] .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
#win[data-size="sm"] .g2,#win[data-size="sm"] .g21,#win[data-size="sm"] .g12{grid-template-columns:1fr}
#win[data-size="sm"] .page{padding:11px 12px}
#win[data-size="sm"] .crumb,#win[data-size="sm"] .brand em,#win[data-size="sm"] .tb{display:none}
#win[data-size="sm"] .rail{width:58px}#win[data-size="sm"] .nav{width:50px}
#win[data-size="sm"] .wbside{width:120px}
#win.maximized .page{max-width:1700px}

let palIdx=0,palMatch=[];
function openPalette(){document.getElementById('palOv').classList.add('show');const i=document.getElementById('palIn');i.value='';i.focus();renderPal()}
function closePalette(){document.getElementById('palOv').classList.remove('show')}
function renderPal(){const q=document.getElementById('palIn').value.trim().toLowerCase();
 palMatch=ALL.filter(m=>!q||m.title.toLowerCase().includes(q)||m.label.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q));
 if(palIdx>=palMatch.length)palIdx=0;
 document.getElementById('palList').innerHTML=palMatch.length?palMatch.map((m,i)=>
  `<div class="pi ${i===palIdx?'sel':''}" onclick="go('${m.id}');closePalette()">${ic(m.icon)}<div><div style="font-weight:650">${m.title}</div><div class="small muted">${m.desc}</div></div><span class="pg">${GROUPS.find(g=>g.items.includes(m))?.label||'系统'}</span></div>`).join(''):`<div class="pi muted">没有匹配的模块</div>`}
function palKey(e){if(e.key==='Escape')closePalette();
 if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palMatch.length-1);renderPal()}
 if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPal()}
 if(e.key==='Enter'&&palMatch[palIdx]){go(palMatch[palIdx].id);closePalette()}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closePalette()});

function spark(data,color){const max=Math.max(...data),min=Math.min(...data),w=100,h=26;
 const pts=data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-2-(v-min)/(max-min||1)*(h-6)).toFixed(1)}`).join(' ');
 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:54px;height:17px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function donut(pct,color){const r=24,c=2*Math.PI*r,off=c*(1-pct/100);
 return `<svg class="donut" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--panel-3)" stroke-width="6"/>
 <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/>
 <text x="32" y="36" text-anchor="middle" font-size="14" font-family="var(--mono)" fill="var(--text)" font-weight="700">${pct}%</text></svg>`}
function head(icon,title,desc,acts=''){return `<div class="ph"><div><div class="pt">${ic(icon,'ico lg')}<h1>${title}</h1></div><div class="pd">${desc}</div></div><div class="acts">${acts}</div></div>`}
function kpi(label,val,sub,data,color){return `<div class="card bar kpi"><div class="kt"><span>${label}</span>${spark(data,color)}</div>
 <div class="kv" style="color:${color}">${val}</div><div class="ks">${sub}</div></div>`}

 let h;if(S.view==='overview')h=vOverview();else if(S.view==='servers')h=vServers();else if(S.view==='workbench')h=vWorkbench();
 else if(S.view==='deploy')h=vDeploy();else if(S.view==='security')h=vSecurity();else if(S.view==='inspector')h=vInspector();
 else if(S.view==='settings')h=vSettings();else h=vGeneric(S.view);
 document.getElementById('page').innerHTML=h;document.getElementById('main').scrollTop=0}

function openModal(title,html,acts){document.getElementById('modal').innerHTML=`<div class="mh"><span>${title}</span><button class="tbi" onclick="closeModal()">${ic('i-x','ico sm')}</button></div><div class="mb">${html}</div><div class="mf">${acts.map(a=>`<button class="${a.cls}" onclick="${a.fn}">${a.t}</button>`).join('')}</div>`;document.getElementById('mdOv').classList.add('show')}
function closeModal(){document.getElementById('mdOv').classList.remove('show')}
function openServerModal(){openModal('新建服务器',`<div class="field"><label>主机名称</label><input id="nfName" placeholder="prod-web-02"></div><div class="field"><label>地址（IP:端口）</label><input id="nfIp" placeholder="10.0.0.12:22"></div><div class="field"><label>环境</label><select><option>dev</option><option>staging</option><option>prod</option></select></div><div class="field"><label>认证方式</label><select><option>密码</option><option>私钥</option><option>SSH-Agent</option><option>ProxyJump 跳板机</option></select></div><div class="notice info">${ic('i-shield','ico sm')}<div>保存后自动做 TCP 探活，按环境绑定 AI 策略与凭据句柄。</div></div>`,
 [{t:'取消',cls:'btn',fn:'closeModal()'},{t:'创建',cls:'btn pri',fn:'createServer()'}])}

window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(MOD[id]&&id!==S.view){S.view=id;render()}});

const WIN=document.getElementById('win');
function toggleMax(){const mx=WIN.classList.toggle('maximized');document.getElementById('maxBtn').innerHTML=ic(mx?'i-restore':'i-square','ico sm');toast(mx?'窗口已最大化 · 内容按宽屏重排':'已还原为 1440×900',mx?'warn':'ok');updateSize()}
function minimizeWin(){WIN.classList.add('minimizing');setTimeout(()=>{WIN.classList.remove('minimizing');toast('已最小化到托盘（原型演示）','info')},340)}
function closeWin(){toast('关闭窗口：实际应用将退出或最小化到托盘（原型演示）','warn')}
function updateSize(){if(!WIN)return;const w=WIN.clientWidth,h=WIN.clientHeight;
 const size=w<1180?'sm':w<1360?'md':'lg';WIN.dataset.size=size;
 const t=document.getElementById('sizeTxt');if(t)t.textContent=w+' × '+h+' · '+(WIN.classList.contains('maximized')?'最大化':size==='lg'?'标准视窗':size==='md'?'中等窗口':'紧凑窗口')}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(updateSize).observe(WIN);else window.addEventListener('resize',updateSize);

applyTheme();const ih=location.hash.slice(1);if(MOD[ih])S.view=ih;render();updateSize();
</script>
