[package]
name = "tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
ai-profile = { version = "0.1", features = ["chat", "client"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
oracle-rs = "0.1.7"
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# 禁止多开：dev/prod 因 identifier 分流各占一个实例锁，可同时各开一个；重复启动唤回已有窗口
tauri-plugin-single-instance = "2"

# ─── 远程运维核心依赖 ─────────────────────
# SSH/SFTP：libssh2 的原生 Rust 绑定，支持密码/私钥/代理跳转
ssh2 = "0.9"
# AES-GCM 加密（凭据 vault）
ring = "0.17"
# 凭据持久化使用 Windows Credential Manager，不把明文写入 SQLite/localStorage。
# keyring 3 默认使用内存 mock；必须显式启用 windows-native，否则退出进程后凭据会丢失。
keyring = { version = "3", features = ["windows-native"] }
# HMAC-SHA256（审计日志防篡改）
hmac = "0.12"
sha2 = "0.10"
# 正则匹配（危险命令黑名单）
regex = "1"
# 并发 HashMap（SSH session pool）
dashmap = "5"
# UUID（工单/会话 ID）
uuid = { version = "1", features = ["serde", "v4"] }
# 详见 src/remote/ 模块和 .claude/skills/remote-gateway/skill.md
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1", features = ["full"] }

# ─── 编译优化 ─────────────────────────────

# 开发模式：依赖包使用 O2 优化（加速运行，不影响本地代码编译速度）
[profile.dev.package."*"]
opt-level = 2

# 发布模式：最小体积 + 最佳性能
[profile.release]
opt-level = "z"         # 最小体积优化
lto = true              # 链接时优化
codegen-units = 1       # 单代码生成单元（更好优化）
strip = true            # 剥离调试符号
panic = "unwind"        # 允许后台任务把 panic 转成错误，避免驱动异常结束整个桌面进程
